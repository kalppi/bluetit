spring:
  application:
    name: bff-service
  webmvc:
    static-path-pattern: /static/**
    resources:
      static-locations:
        - classpath:/static/

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Backend service URLs
services:
  clip-service:
    url: http://localhost:8081


