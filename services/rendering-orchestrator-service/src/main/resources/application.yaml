spring:
  application:
    name: rendering-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/clipdb
    username: clip
    password: clip
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: clip
    password: clip

server:
  port: 8082

messaging:
  exchange:
    events: events.exchange
  queue:
    clip-requested: clip-requested-queue
  routing-key:
    clip-requested: ClipRequested

rendering:
  service:
    pool:
      services:
        - http://localhost:9001
        - http://localhost:9002
        - http://localhost:9003

