spring:
  application:
    name: clip-service
  datasource:
    url: jdbc:postgresql://localhost:5432/clipdb
    username: clip
    password: clip
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: clip
    password: clip

messaging:
  exchange:
    events: events.exchange
  queue:
    clip-requested: clip-requested-queue
  routing-key:
    clip-requested: ClipRequested

server:
  port: 8081